services:
  bot:
    container_name: "HamsterKombatBot"
    build:
      context: .
    logging:
      driver: "json-file"
      options:
        max-file: 3
        max-size: 10m
    stop_signal: SIGINT
    restart: unless-stopped
    command: "python3 main.py -a 2"
    volumes:
      - ./sessions:/app/sessions
      - ./do_not_commit.profiles.json:/app/do_not_commit.profiles.json
    env_file:
      - .env
